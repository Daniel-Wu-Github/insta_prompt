<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plain textarea baseline</title>
<style>
	body { margin: 0; padding: 40px; font-family: system-ui, sans-serif; background: #fafafa; }
	main { max-width: 720px; margin: 0 auto; }
	#composer {
		width: 100%; min-height: 120px; box-sizing: border-box;
		font: 16px/1.5 system-ui, sans-serif; padding: 12px 14px;
		border: 1px solid #d0d7de; border-radius: 8px; white-space: pre-wrap;
	}
</style>
</head>
<body>
<main>
	<h1>Baseline composer</h1>
	<label for="composer">Message</label>
	<textarea id="composer" name="composer"></textarea>
</main>
</body>
</html>
