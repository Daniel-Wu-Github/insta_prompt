<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub-shaped issue form</title>
<style>
	body { margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
	.container { max-width: 760px; margin: 60px auto; }
	#issue_body {
		width: 100%; min-height: 160px; box-sizing: border-box;
		font: 14px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
		padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; white-space: pre-wrap;
	}
</style>
</head>
<body>
<div class="container">
	<h1>New issue</h1>
	<label for="issue_body">Add a description</label>
	<textarea id="issue_body" name="issue[body]"></textarea>
</div>
</body>
</html>
